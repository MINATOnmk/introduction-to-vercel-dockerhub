  deploy:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      
      - name: checkout code
        uses: actions/checkout@v4
      - name: deploy to vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--yes'

      